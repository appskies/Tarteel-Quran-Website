<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact AI Quran. Get in touch with us for support or questions about the iPhone and Android apps.">
    <title>Contact Us - AI Quran</title>
    <link rel="icon" type="image/png" href="Assets/app-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="/" class="navbar-brand">
                <img src="Assets/app-icon.png" alt="AI Quran logo" class="navbar-logo">
                <span class="navbar-name">AI Quran</span>
            </a>
            <div class="navbar-menu" id="navbarMenu">
                <a href="index.html" class="navbar-link">Home</a>
                <a href="contact.html" class="navbar-link active">Contact</a>
                <a href="https://apps.apple.com/us/app/ai-quran-reader-athkar-tarteel/id6749589788" class="navbar-cta">
                    <img src="Assets/app-store-badge.svg" alt="Download on the App Store" class="navbar-badge">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.skiestech.aiquran" class="navbar-cta">
                    <img src="Assets/google-play-badge.png" alt="Get it on Google Play" class="navbar-play-badge">
                </a>
            </div>
            <button class="navbar-toggle" id="navbarToggle"><span class="navbar-toggle-icon"></span></button>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container">
            <div class="contact-header">
                <h1 class="section-title">Get In <span class="highlight">Touch</span></h1>
                <p class="section-subtitle">Have questions? We'd love to hear from you.</p>
            </div>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="info-item">
                        <span class="info-icon">✉️</span>
                        <div>
                            <h3>Email</h3>
                            <p>appskiesltd@gmail.com</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">📖</span>
                        <div>
                            <h3>Quick Response</h3>
                            <p>We typically respond within 24 hours</p>
                        </div>
                    </div>
                </div>
                <div class="contact-form-wrapper">
                    <form class="contact-form" id="contactForm" action="https://api.web3forms.com/submit" method="POST">
                        <input type="hidden" name="access_key" value="e549a701-abc5-4e7c-9537-79efd76bed1f">
                        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="appskiesltd@gmail.com" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" placeholder="Your message..." rows="5" required></textarea>
                        </div>
                        <div class="h-captcha" data-captcha="true"></div>
                        <button type="submit" class="btn btn-primary">
                            <span class="btn-text">Send Message</span>
                            <span class="btn-loader" style="display: none;"><span class="spinner"></span> Sending...</span>
                        </button>
                        <div id="formStatus" class="form-status" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <img src="Assets/app-icon.png" alt="AI Quran logo" class="footer-logo">
                    <span class="footer-name">AI Quran</span>
                </div>
                <nav class="footer-links">
                    <a href="privacy.html">Privacy Policy</a>
                    <a href="terms.html">Terms of Service</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <p class="footer-copyright">&copy; 2026 Appskies. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
</body>
</html>
